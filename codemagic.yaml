workflows:
  ios-unsigned-ipa:
    name: Arnouba Game iOS IPA (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Sync Web Game Bundle to Flutter Assets
        script: |
          mkdir -p assets/www/assets
          cp index.html style.css game.js manifest.json sw.js assets/www/
          cp assets/*.* assets/www/assets/ || true
          flutter pub get
      - name: Build iOS App (Unsigned Release)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y Arnouba_Game_iOS.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
