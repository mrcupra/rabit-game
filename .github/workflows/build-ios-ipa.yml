name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios_ipa:
    name: Build Arnouba Game IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync Web Bundle & Get Dependencies
        run: |
          mkdir -p assets/www/assets
          cp index.html style.css game.js manifest.json sw.js assets/www/
          cp assets/*.* assets/www/assets/ || true
          flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA (Payload/Runner.app)
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r -y Arnouba_Game_iOS.ipa Payload
          ls -lh Arnouba_Game_iOS.ipa

      - name: Upload Arnouba_Game_iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arnouba_Game_iOS
          path: build/ipa/Arnouba_Game_iOS.ipa
          retention-days: 30
